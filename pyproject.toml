[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwell-lint"
version = "0.1.0"
description = "Does your coupling extractor predict physics that cannot exist? Tests any extractor against the many-body screening ceiling."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ChipletOS / Genesis contributors" }]
keywords = ["eda", "parasitic-extraction", "coupling", "crosstalk", "screening",
            "signal-integrity", "physics", "validation", "linting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
maxwell-lint = "maxwell_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Declared explicitly so lint is deterministic across ruff versions; see the
# note in CI. E4/E7/E9 + F is ruff's long-standing default, I adds isort.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
